<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E9187"/>
      <stop offset="1" stop-color="#2B675E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#pond)"/>
  {/* lily pads */}
  <path d="M436,472 L580,428 A150,150 0 1 0 580,516 Z" fill="#2E7A68" opacity="0.55"/>
  <path d="M66,52 L176,18 A112,112 0 1 0 176,86 Z" fill="#2E7A68" opacity="0.40"/>
  {/* bubbles */}
  <circle cx="120" cy="420" r="14" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="440" cy="120" r="10" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="400" cy="86" r="6" fill="#FFFFFF" opacity="0.12"/>
  <g transform="translate(58 91) scale(3.3)">
    {/* crown */}
    <g transform="translate(60 6)">
      <polygon points="-19,8 -11,-3 -4,5 0,-7 4,5 11,-3 19,8 12,13 -12,13"
        fill="#FFD84D" stroke="#C7951F" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="0" cy="-10" r="2.2" fill="#FFF3B8"/>
    </g>
    {/* eye bumps */}
    <circle cx="40" cy="32" r="15.5" fill="#F0C24F" stroke="#BC8F22" stroke-width="3.5"/>
    <circle cx="80" cy="32" r="15.5" fill="#F0C24F" stroke="#BC8F22" stroke-width="3.5"/>
    {/* body */}
    <path d="M60,22 C88,22 106,42 106,67 C106,93 86,105 60,105 C34,105 14,93 14,67 C14,42 32,22 60,22 Z"
      fill="#F0C24F" stroke="#BC8F22" stroke-width="3.5"/>
    {/* belly */}
    <ellipse cx="60" cy="80" rx="27.5" ry="23" fill="#FCF3D8"/>
    {/* arms */}
    <ellipse cx="33" cy="77" rx="11" ry="6.5" fill="#F0C24F" stroke="#BC8F22" stroke-width="3" transform="rotate(26 33 77)"/>
    <ellipse cx="87" cy="77" rx="11" ry="6.5" fill="#F0C24F" stroke="#BC8F22" stroke-width="3" transform="rotate(-26 87 77)"/>
    {/* feet */}
    <ellipse cx="42" cy="104" rx="11.5" ry="5.5" fill="#F0C24F" stroke="#BC8F22" stroke-width="3"/>
    <ellipse cx="78" cy="104" rx="11.5" ry="5.5" fill="#F0C24F" stroke="#BC8F22" stroke-width="3"/>
    {/* cheeks */}
    <circle cx="24" cy="63" r="5.5" fill="#F2A0A0" opacity="0.4"/>
    <circle cx="96" cy="63" r="5.5" fill="#F2A0A0" opacity="0.4"/>
    {/* eyes */}
    <circle cx="40" cy="31" r="9.6" fill="#2D2320"/>
    <circle cx="36.4" cy="27.4" r="3.4" fill="#FFFFFF"/>
    <circle cx="43.2" cy="33.6" r="1.7" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="80" cy="31" r="9.6" fill="#2D2320"/>
    <circle cx="76.4" cy="27.4" r="3.4" fill="#FFFFFF"/>
    <circle cx="83.2" cy="33.6" r="1.7" fill="#FFFFFF" opacity="0.85"/>
    {/* nostrils + smile */}
    <circle cx="54.5" cy="46.5" r="1.7" fill="#BC8F22" opacity="0.85"/>
    <circle cx="65.5" cy="46.5" r="1.7" fill="#BC8F22" opacity="0.85"/>
    <path d="M49,55 Q60,63 71,55" stroke="#BC8F22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    {/* number 2048 (double draw: stroke underlay + fill) */}
    <text x="60" y="92" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
      font-size="21" fill="none" stroke="#BC8F22" stroke-width="5.5">2048</text>
    <text x="60" y="92" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
      font-size="21" fill="#FFFFFF">2048</text>
  </g>
</svg>